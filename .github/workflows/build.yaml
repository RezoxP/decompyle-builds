name: Compile pycdc for Windows & Linux
on: workflow_dispatch

jobs:
  build-job:
    runs-on: ubuntu-22.04
      
    steps:
      - name: Install mingw-w64
        run: |
          sudo apt update
          sudo apt install -y mingw-w64

      - name: Clone pycdc
        run: git clone --depth=1 https://github.com/zrax/pycdc

      - name: Compile for Windows
        run: >
          cd pycdc
          
          echo "RELEASE_COMMIT=$(git log -1 --format=%h)" >> ${GITHUB_ENV}

          cmake -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++
          -DCMAKE_FIND_ROOT_PATH=/usr/i686-w64-mingw32
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
          -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
          -DCMAKE_CXX_STANDARD_LIBRARIES="-static-libgcc -static-libstdc++"
          .
          
          make

      - name: Set release date & time
        run: |
          echo "RELEASE_DATE=$(date -u +%d-%b-%Y)" >> ${GITHUB_ENV}
          echo "RELEASE_TIME=$(date -u +%H:%M)" >> ${GITHUB_ENV}

      - name: Stage Windows artifacts
        run: |
          mkdir -p staging/windows release
          cp pycdc/pycdc.exe staging/windows/
          cp pycdc/pycdas.exe staging/windows/
          cp pycdc/pycdc.exe release/pycdc-windows-x86.exe
          cp pycdc/pycdas.exe release/pycdas-windows-x86.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pycdc-windows-x86
          path: staging/windows/

      - name: Setup latest Alpine Linux x86_64
        uses: jirutka/setup-alpine@v1
        with:
          packages: >
            alpine-sdk
            cmake
            python3
        
      - name: Compile for Linux x86_64       
        run: |
          cd pycdc
          git clean -d -f -x
          sed -i '/target_link_libraries(pycdas pycxx)/c target_link_libraries(pycdas pycxx -static)' CMakeLists.txt
          sed -i '/target_link_libraries(pycdc pycxx)/c target_link_libraries(pycdc pycxx -static)' CMakeLists.txt
          cmake .
          make
        shell: alpine.sh {0}

      - name: Stage Linux x86_64 artifacts
        run: |
          mkdir -p staging/linux-x86_64
          cp pycdc/pycdc staging/linux-x86_64/
          cp pycdc/pycdas staging/linux-x86_64/
          cp pycdc/pycdc release/pycdc-linux-x86_64
          cp pycdc/pycdas release/pycdas-linux-x86_64

      - name: Upload Linux x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pycdc-linux-x86_64
          path: staging/linux-x86_64/

      - name: Setup latest Alpine Linux aarch64
        uses: jirutka/setup-alpine@v1        
        with:
          arch: aarch64
          packages: >
            alpine-sdk
            cmake
            python3

      - name: Compile for Linux AArch64       
        run: |
          cd pycdc
          git clean -d -f -x
          sed -i '/target_link_libraries(pycdas pycxx)/c target_link_libraries(pycdas pycxx -static)' CMakeLists.txt
          sed -i '/target_link_libraries(pycdc pycxx)/c target_link_libraries(pycdc pycxx -static)' CMakeLists.txt
          cmake .
          make
        shell: alpine.sh {0}        

      - name: Stage Linux aarch64 artifacts
        run: |
          mkdir -p staging/linux-aarch64
          cp pycdc/pycdc staging/linux-aarch64/
          cp pycdc/pycdas staging/linux-aarch64/
          cp pycdc/pycdc release/pycdc-linux-aarch64
          cp pycdc/pycdas release/pycdas-linux-aarch64

      - name: Upload Linux AArch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pycdc-linux-aarch64
          path: staging/linux-aarch64/

      - name: Verify release files
        run: ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Decompyle++ ${{ env.RELEASE_DATE }}
          tag_name: build-${{ env.RELEASE_DATE }}-${{ env.RELEASE_COMMIT }}
          body: Compiled on ${{ env.RELEASE_DATE }} at ${{ env.RELEASE_TIME }} GMT, pycdc commit ${{ env.RELEASE_COMMIT }}
          files: release/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
