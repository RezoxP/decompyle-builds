name: Compile pycdc for Windows & Linux
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-job:
    runs-on: ubuntu-22.04
      
    steps:
      - name: Clone pycdc
        run: git clone --depth=1 https://github.com/zrax/pycdc

      - name: Check for new upstream commits
        id: check_new
        run: |
          cd pycdc
          COMMIT=$(git log -1 --format=%h)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          # Check if a release with this commit already exists
          EXISTING=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/build-$(date -u +%d-%b-%Y)-${COMMIT}" 2>/dev/null || true)
          # Also check recent releases for this commit hash in any tag
          TAGS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=5" \
            | grep -o "build-[^\"]*${COMMIT}" || true)
          if { [ "$EXISTING" = "200" ] || [ -n "$TAGS" ]; } && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Commit $COMMIT already has a release, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New commit $COMMIT detected, proceeding with build."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install mingw-w64
        if: steps.check_new.outputs.skip != 'true'
        run: |
          sudo apt update
          sudo apt install -y mingw-w64

      # ── Windows 32-bit ──
      - name: Compile for Windows 32-bit
        if: steps.check_new.outputs.skip != 'true'
        run: >
          cd pycdc

          echo "RELEASE_COMMIT=$(git log -1 --format=%h)" >> ${GITHUB_ENV}

          cmake -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++
          -DCMAKE_FIND_ROOT_PATH=/usr/i686-w64-mingw32
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
          -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
          -DCMAKE_CXX_STANDARD_LIBRARIES="-static-libgcc -static-libstdc++"
          .

          make

      - name: Set release date & time
        if: steps.check_new.outputs.skip != 'true'
        run: |
          echo "RELEASE_DATE=$(date -u +%d-%b-%Y)" >> ${GITHUB_ENV}
          echo "RELEASE_TIME=$(date -u +%H:%M)" >> ${GITHUB_ENV}

      - name: Stage Windows 32-bit artifacts
        if: steps.check_new.outputs.skip != 'true'
        run: |
          mkdir -p staging/win32 release
          cp pycdc/pycdc.exe staging/win32/
          cp pycdc/pycdas.exe staging/win32/
          cp pycdc/pycdc.exe release/pycdc-win32.exe
          cp pycdc/pycdas.exe release/pycdas-win32.exe

      - name: Upload Windows 32-bit artifacts
        if: steps.check_new.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pycdc-win32
          path: staging/win32/

      # ── Windows 64-bit ──
      - name: Compile for Windows 64-bit
        if: steps.check_new.outputs.skip != 'true'
        run: |
          cd pycdc
          git clean -d -f -x
          cmake -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_CXX_STANDARD_LIBRARIES="-static-libgcc -static-libstdc++" \
            .
          make

      - name: Stage Windows 64-bit artifacts
        if: steps.check_new.outputs.skip != 'true'
        run: |
          mkdir -p staging/win64
          cp pycdc/pycdc.exe staging/win64/
          cp pycdc/pycdas.exe staging/win64/
          cp pycdc/pycdc.exe release/pycdc-win64.exe
          cp pycdc/pycdas.exe release/pycdas-win64.exe

      - name: Upload Windows 64-bit artifacts
        if: steps.check_new.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pycdc-win64
          path: staging/win64/

      # ── Linux x64 ──
      - name: Setup latest Alpine Linux x86_64
        if: steps.check_new.outputs.skip != 'true'
        uses: jirutka/setup-alpine@v1
        with:
          packages: >
            alpine-sdk
            cmake
            python3
        
      - name: Compile for Linux x64
        if: steps.check_new.outputs.skip != 'true'
        run: |
          cd pycdc
          git clean -d -f -x
          sed -i '/target_link_libraries(pycdas pycxx)/c target_link_libraries(pycdas pycxx -static)' CMakeLists.txt
          sed -i '/target_link_libraries(pycdc pycxx)/c target_link_libraries(pycdc pycxx -static)' CMakeLists.txt
          cmake .
          make
        shell: alpine.sh {0}

      - name: Stage Linux x64 artifacts
        if: steps.check_new.outputs.skip != 'true'
        run: |
          mkdir -p staging/linux-x64
          cp pycdc/pycdc staging/linux-x64/
          cp pycdc/pycdas staging/linux-x64/
          cp pycdc/pycdc release/pycdc-linux-x64
          cp pycdc/pycdas release/pycdas-linux-x64

      - name: Upload Linux x64 artifacts
        if: steps.check_new.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pycdc-linux-x64
          path: staging/linux-x64/

      # ── Linux ARM64 ──
      - name: Setup latest Alpine Linux aarch64
        if: steps.check_new.outputs.skip != 'true'
        uses: jirutka/setup-alpine@v1        
        with:
          arch: aarch64
          packages: >
            alpine-sdk
            cmake
            python3

      - name: Compile for Linux ARM64
        if: steps.check_new.outputs.skip != 'true'
        run: |
          cd pycdc
          git clean -d -f -x
          sed -i '/target_link_libraries(pycdas pycxx)/c target_link_libraries(pycdas pycxx -static)' CMakeLists.txt
          sed -i '/target_link_libraries(pycdc pycxx)/c target_link_libraries(pycdc pycxx -static)' CMakeLists.txt
          cmake .
          make
        shell: alpine.sh {0}        

      - name: Stage Linux ARM64 artifacts
        if: steps.check_new.outputs.skip != 'true'
        run: |
          mkdir -p staging/linux-arm64
          cp pycdc/pycdc staging/linux-arm64/
          cp pycdc/pycdas staging/linux-arm64/
          cp pycdc/pycdc release/pycdc-linux-arm64
          cp pycdc/pycdas release/pycdas-linux-arm64

      - name: Upload Linux ARM64 artifacts
        if: steps.check_new.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pycdc-linux-arm64
          path: staging/linux-arm64/

      # ── Release ──
      - name: Verify release files
        if: steps.check_new.outputs.skip != 'true'
        run: ls -la release/

      - name: Create release
        if: steps.check_new.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Decompyle++ ${{ env.RELEASE_DATE }}
          tag_name: build-${{ env.RELEASE_DATE }}-${{ env.RELEASE_COMMIT }}
          body: Compiled on ${{ env.RELEASE_DATE }} at ${{ env.RELEASE_TIME }} GMT, pycdc commit ${{ env.RELEASE_COMMIT }}
          files: release/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
